name: Build Linux amd64

on:
  push:
    branches:
      - master

run-name: Build go-judge (${{ github.sha }})

permissions:
  contents: read

jobs:
  build:
    name: Build go-judge Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Generate version
        run: git rev-parse HEAD > cmd/go-judge/version/version.txt

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -tags nomsgpack,grpcnotrace -o dist/go-judge ./cmd/go-judge

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: go-judge-linux-amd64-${{ github.sha }}
          path: dist/go-judge
          if-no-files-found: error
